<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <title>ModernTech Login</title>
</head>
<body>
  <!-- Orbit now wraps the blob -->
  <div class="orbit">
    <img src="blob.svg" alt="purple circle" class="blob">
  </div>
  <div class="orbit2">
    <img src="blob.svg" alt="purple circle" class="blob">
  </div>
  <div class="orbit3">
    <img src="blob.svg" alt="purple circle" class="blob">
  </div>

  <!-- Login form -->
  <form action="" class="login-form animate__animated animate__headShake">
    <h2>ModernTech Solutions</h2>
    <h3>Welcome back user!</h3>

    <label for="name"><i class="fas fa-user"></i> Username:</label>
    <input type="text" id="name" placeholder="Username" required>

        <label for="password"><i class="fas fa-lock"></i> Password:</label>
    <div class="password-container">
        <input type="password" id="password" placeholder="Password" required autocomplete="new-password">
        <div id="toggle-container"> 
            <i class="fas fa-eye" id="toggle-password"></i>
        </div>
        <!-- put the toggle icon in a seperate div to make its connections with the associate element better -->
    </div>

    <button type="submit">Login</button>
    <a href="#" class="forgot-pwd">Forgot Password?</a>
  </form>

  <script src="login.js"></script>
</body>
</html>
